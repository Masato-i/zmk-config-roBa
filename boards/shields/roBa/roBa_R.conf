CONFIG_ZMK_KEYBOARD_NAME="roBa"

CONFIG_ZMK_POINTING=y
CONFIG_NFCT_PINS_AS_GPIOS=y
CONFIG_ZMK_BLE=y

CONFIG_SPI=y
CONFIG_INPUT=y

# DYA Studio対応 / COROPIT対応: トラックボール (cormoran 版 PMW3610 ドライバ)
#   CPI はここではなく overlay のノード (cpi = <...>) で指定する。
#   向きが合わない軸だけ下を切替える (実機で確認。Studio の rotation でも調整可):
#     上下が逆 → CONFIG_PMW3610_INVERT_Y=y
#     左右が逆 → CONFIG_PMW3610_INVERT_X=y
#     縦横が入替わっている → CONFIG_PMW3610_SWAP_XY=y
CONFIG_PMW3610=y
CONFIG_PMW3610_INVERT_Y=y
# CONFIG_PMW3610_INVERT_X=y
# CONFIG_PMW3610_SWAP_XY=y
CONFIG_PMW3610_REPORT_INTERVAL_MIN=12
CONFIG_PMW3610_INIT_POWER_UP_EXTRA_DELAY_MS=200
CONFIG_PMW3610_SMART_ALGORITHM=y

CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# ZMK Studio 本体
CONFIG_ZMK_STUDIO=y
# Studio ロックを無効化したい場合は次を有効化 (デフォルトはロックあり)
# CONFIG_ZMK_STUDIO_LOCKING=n

# DYA Studio対応(無線): BLE(GATT)経由の Studio 接続を明示的に有効化する。
#   ZMK 既定でも y だが意図を明示。USB スニペットと併用でき、USB/BLE 両対応になる。
#   BLE スロットは split central 既定の 6/6 のままで 5 プロファイル＋peripheral＋Studio を賄える
#   (moNa2 の 5/5 は既定より少ないため roBa では採用しない)。
CONFIG_ZMK_STUDIO_TRANSPORT_BLE=y
# 任意: 接続中だけ低レイテンシ要求 (既定10。UI 応答を速くしたい場合のみ)
# CONFIG_ZMK_STUDIO_TRANSPORT_BLE_PREF_LATENCY=10

# DYA Studio対応モジュール ------------------------------------------------
# BLE 管理 (Studio から BLE プロファイルを操作)
CONFIG_ZMK_BLE_MANAGEMENT=y
CONFIG_ZMK_BLE_MANAGEMENT_STUDIO_RPC=y

# Runtime Input Processor (トラックボール: auto mouse layer / スクロール / 感度を Studio から変更)
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR=y
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR_STUDIO_RPC=y

# 設定の永続化を Studio と同期 (保存・再起動後も保持)
CONFIG_ZMK_SETTINGS_RPC=y
CONFIG_ZMK_SETTINGS_RPC_STUDIO=y

# 分割キーボードで central→peripheral へ設定変更を伝搬
CONFIG_ZMK_SPLIT_RELAY_EVENT=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_SPLIT_RUN_STACK_SIZE=1024

# 設定保存のデバウンス (ms)
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000
